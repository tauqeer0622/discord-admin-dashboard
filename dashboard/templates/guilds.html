{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>
        Discord Admin Dashboard
    </title>

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

</head>

<body>

    <div class="navbar">

        <a
            href="/"
            class="nav-link"
        >
            Dashboard
        </a>

        <a
            href="/configs/"
            class="nav-link"
        >
            Configurations
        </a>

        <a
            href="/admin/"
            class="nav-link"
        >
            Admin
        </a>

    </div>

    <div class="container">

        <h1>
            Add Configuration
        </h1>

        <form
            method="POST"
            action="/save-config/"
        >

            {% csrf_token %}

            <div class="card">

                <label>
                    Select Server
                </label>

                <select
                    id="serverDropdown"
                    name="guild_id"
                    required
                >

                    {% for guild in guilds %}

                    <option
                        value="{{ guild.id }}"
                        data-name="{{ guild.name }}"
                    >

                        {{ guild.name }}

                    </option>

                    {% endfor %}

                </select>

                <br><br>

                <label>
                    Select Channel
                </label>

                <select
                    id="channelDropdown"
                    name="channel_id"
                    required
                >

                    <option>
                        Select Server First
                    </option>

                </select>

                <input
                    type="hidden"
                    name="guild_name"
                    id="guildNameInput"
                >

                <input
                    type="hidden"
                    name="channel_name"
                    id="channelNameInput"
                >

                <br><br>

                <button type="submit">

                    Save Configuration

                </button>

            </div>

        </form>

    </div>

    <script>

        const serverDropdown =
            document.getElementById(
                "serverDropdown"
            )

        const channelDropdown =
            document.getElementById(
                "channelDropdown"
            )

        const guildNameInput =
            document.getElementById(
                "guildNameInput"
            )

        const channelNameInput =
            document.getElementById(
                "channelNameInput"
            )

        async function loadChannels() {

            const guildId =
                serverDropdown.value

            const guildName =
                serverDropdown.options[
                    serverDropdown.selectedIndex
                ].dataset.name

            guildNameInput.value =
                guildName

            channelDropdown.innerHTML =
                "<option>Loading...</option>"

            const response =
                await fetch(
                    `/api/channels/${guildId}/`
                )

            const channels =
                await response.json()

            channelDropdown.innerHTML = ""

            channels.forEach(channel => {

                const option =
                    document.createElement(
                        "option"
                    )

                option.value =
                    channel.id

                option.textContent =
                    channel.name

                option.dataset.name =
                    channel.name

                channelDropdown.appendChild(
                    option
                )
            })

            if (channels.length > 0) {

                channelNameInput.value =
                    channels[0].name
            }
        }

        channelDropdown.addEventListener(
            "change",

            function () {

                const selectedOption =
                    channelDropdown.options[
                        channelDropdown.selectedIndex
                    ]

                channelNameInput.value =
                    selectedOption.dataset.name
            }
        )

        serverDropdown.addEventListener(
            "change",
            loadChannels
        )

        window.onload = loadChannels

    </script>

</body>

</html>
