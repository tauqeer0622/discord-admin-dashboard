{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>
        Discord Command Center
    </title>

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

</head>

<body>

    <div class="navbar">

        <div class="logo">

            Discord Command Center

        </div>

        <div class="nav-items">

            <a
                href="/"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="/configs/"
                class="nav-link active-link"
            >
                Configurations
            </a>

            <a
                href="/messages/"
                class="nav-link"
            >
                Messages
            </a>

            <a
                href="/admin/"
                class="nav-link"
            >
                Admin
            </a>

        </div>

    </div>

    <div class="container">

        <h1 class="page-title">

            Add Configuration

        </h1>

        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">

                    <div>

                        <label>

                            Select Server

                        </label>

                        <select
                            id="serverDropdown"
                            name="guild_id"
                        >

                            {% for guild in guilds %}

                            <option
                                value="{{ guild.id }}"
                                data-name="{{ guild.name }}"
                            >

                                {{ guild.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div>

                        <label>

                            Select Channel

                        </label>

                        <select
                            id="channelDropdown"
                            name="channel_id"
                            required
                        >

                            <option>

                                Loading...

                            </option>

                        </select>

                    </div>

                    <input
                        type="hidden"
                        name="guild_name"
                        id="guildNameInput"
                    >

                    <input
                        type="hidden"
                        name="channel_name"
                        id="channelNameInput"
                    >

                </div>

                <div class="button-row">

                    <button type="submit">

                        Save Configuration

                    </button>

                </div>

            </form>

        </div>

    </div>

    <footer>

        © 2026 Discord Command Center.
        All rights reserved.

    </footer>

    <script>

        const serverDropdown =
            document.getElementById(
                "serverDropdown"
            );

        const channelDropdown =
            document.getElementById(
                "channelDropdown"
            );

        const guildNameInput =
            document.getElementById(
                "guildNameInput"
            );

        const channelNameInput =
            document.getElementById(
                "channelNameInput"
            );

        async function loadChannels() {

            const guildId =
                serverDropdown.value;

            guildNameInput.value =
                serverDropdown.options[
                    serverDropdown.selectedIndex
                ].dataset.name;

            channelDropdown.innerHTML =
                `<option>Loading...</option>`;

            try {

                const response =
                    await fetch(

                        `https://curly-rice-kick.loca.lt/api/channels?guild_id=${guildId}`

                    );

                const channels =
                    await response.json();

                channelDropdown.innerHTML =
                    "";

                if (channels.error) {

                    channelDropdown.innerHTML =
                        `<option>${channels.error}</option>`;

                    return;
                }

                channels.forEach(channel => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        channel.channel_id;

                    option.textContent =
                        channel.channel_name;

                    option.dataset.name =
                        channel.channel_name;

                    channelDropdown.appendChild(
                        option
                    );

                });

                if (
                    channelDropdown.options.length > 0
                ) {

                    channelNameInput.value =
                        channelDropdown.options[0]
                        .dataset.name;
                }

            } catch (error) {

                console.error(error);

                channelDropdown.innerHTML =
                    `<option>Error loading channels</option>`;
            }

        }

        serverDropdown.addEventListener(
            "change",
            loadChannels
        );

        channelDropdown.addEventListener(
            "change",
            function () {

                channelNameInput.value =
                    this.options[
                        this.selectedIndex
                    ].dataset.name;
            }
        );

        loadChannels();

    </script>

</body>

</html>
