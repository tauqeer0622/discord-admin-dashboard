{% load static %}

<!DOCTYPE html>
<html>

<head>
    <title>Channels</title>
    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >
</head>

<body>

    <h1>Server Channels</h1>

    <ul>

        {% for channel in channels %}

            <li>

                {{ channel.name }}

                -
                {{ channel.id }}

            </li>

        {% endfor %}

    </ul>

</body>

</html>
